<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon.it</title>
    <link rel="reset" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <div>
        <img src="./images/logo.png" alt="logo-amazon" />
      </div>
      <div class="button">
        <a href="www.page.com">All</a>
        <a href="www.page.com">Today's Deals</a>
        <a href="www.page.com">Customer Service</a>
        <a href="www.page.com">Registry</a>
        <a href="www.page.com">Gift Cards</a>
        <a href="www.page.com">Sell</a>
      </div>
    </header>
    <main>
      <div class="orange">
        <a href="www.page.com">Shop</a>
        <a href="www.page.com">All</a>
        <a href="www.page.com">Holiday</a>
        <a href="www.page.com">Gift Cards</a>
      </div>
      <div class="banner">
        <div>
          <h1>Holiday Gift Guides</h1>
          <h3>Be a go-gifter</h3>
        </div>
      </div>
      <section class="photo-section">
        <div class="photo-header">
          <h3>Find the perfect gift</h3>
          <a class="shop" href="#">Shop now</a>
        </div>
        <div class="foto">
          <img src="./images/img_1.jpg" alt="ipad" />
          <img src="./images/img_2.jpg" alt="Laptop" />
          <img src="./images/img_3.jpg" alt="Watch" />
          <img src="./images/img_4.jpg" alt="Pets" />
        </div>
      </section>
      <div class="full-img">
        <img class="big-img" src="./images/img_9.png" alt="vr" />
        <h3>Play the gifting game</h3>
        <a class="shop" href="#">Shop gaming</a>
      </div>
      <div class="full-img">
        <img class="big-img" src="./images/img_10.png" alt="vr" />
        <h3>The sound of cheert</h3>
        <a class="shop" href="#">Shop Audio & Accessories</a>
      </div>
    </main>
    <footer>
      <div>
        <a href="#">Back to top</a>
      </div>
      <div class="last-logo">
        <img src="./images/logo.png" alt="last-logo" />
      </div>
    </footer>
  </body>
</html>
